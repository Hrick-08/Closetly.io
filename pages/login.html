<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Closetly</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="../style/auth.css" />
</head>

<body>
  <div class="auth-page">

    <div class="auth-card">

      <a href="../index.html" class="auth-brand">
        <img src="../assets/closetly-logo.png" alt="Closetly logo" class="auth-brand-icon" />
        <span class="auth-brand-name">Closetly</span>
      </a>

      <h1 class="auth-heading">Welcome Back</h1>
      <p class="auth-sub">Log in to access your wardrobe and AI stylist.</p>

      <!-- error banner -->
      <div class="auth-form-error" id="loginError">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="loginErrorText"></span>
      </div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <div class="input-wrap">
            <i class="bi bi-envelope field-icon"></i>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="auth-error-msg" id="loginEmailErr"></div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <i class="bi bi-lock field-icon"></i>
            <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" />
          </div>
          <div class="auth-error-msg" id="loginPassErr"></div>
        </div>

        <button type="submit" class="auth-submit">Log In</button>
      </form>

      <a href="#" class="forgot-link" onclick="alert('Password reset will be available once a backend is connected.'); return false;">Forgot Password?</a>

      <div class="auth-divider">or</div>

      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>

    </div>
  </div>

  <script src="../script/auth.js"></script>
  <script>
    /* Redirect if already logged in */
    if (Auth.isLoggedIn()) {
      if (Auth.isProfileComplete()) {
        window.location.href = "../index.html";
      } else {
        window.location.href = "profile.html";
      }
    }

    const form = document.getElementById("loginForm");
    const errBanner = document.getElementById("loginError");
    const errText = document.getElementById("loginErrorText");

    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.classList.add("visible"); }
    }
    function clearFieldError(id) {
      const el = document.getElementById(id);
      if (el) { el.textContent = ""; el.classList.remove("visible"); }
    }
    function clearAllErrors() {
      ["loginEmailErr", "loginPassErr"].forEach(clearFieldError);
      errBanner.classList.remove("visible");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAllErrors();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      let valid = true;

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError("loginEmailErr", "Please enter a valid email address.");
        valid = false;
      }
      if (!password) {
        showFieldError("loginPassErr", "Password is required.");
        valid = false;
      }
      if (!valid) return;

      const btn = form.querySelector(".auth-submit");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        await Auth.logIn({ email, password });
        if (Auth.isProfileComplete()) {
          window.location.href = "../index.html";
        } else {
          window.location.href = "profile.html";
        }
      } catch (err) {
        errText.textContent = err.message;
        errBanner.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
